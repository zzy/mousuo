[package]
name = "mousuo"
version = "0.1.0"
edition = "2024"
description = "mousuo — 眸索 媒体内容管理"

[dependencies]
topcoat = { path = "../tmp/topcoat/crates/topcoat", features = [
    "tailwind",
    "multipart",
    "mail",
    "mail-smtp",
    "ui",
    "font-fontsource",
    "icon-iconify",
    "sse",
    "tower",
] }
futures-util = "0.3"
surrealdb = "3"
tokio     = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
icu       = { version = "2", features = ["compiled_data", "sync"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

argon2 = "0.6"
base64 = "0.23"
aws-lc-rs = "1"

uuid           = { version = "1", features = ["v4"] }
dotenvy        = "0.15"
chrono         = "0.4"
pulldown-cmark = "0.13"

[build-dependencies]
topcoat = { path = "../tmp/topcoat/crates/topcoat", default-features = false, features = ["tailwind", "icon-iconify"] }
icu     = { version = "2", features = ["compiled_data", "sync"] }

[profile.release]
lto          = "thin"
codegen-units = 1
